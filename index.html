<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsify</title>

    <link rel="stylesheet" href="style.css">

    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>

<body>
    <header class="header">
        <nav class="navbar">
            <a href="dashboard.html" >Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </nav>

        <form action="#" class="search-bar">
            <input type="text" placeholder="Search...">
            <button type="submit"><i class='bx bx-search'></i></button> 
        </form>

    </header>

    <div class="background"></div>

    <div class="container">
        <div class="content">
            <h2 class="logo"><i class='bx bxs-news'>
            </i>Newsify</h2>

            <div class="text-sci">
                <h2>Welcome!<br><span>To our Website.</span></h2>

                <p>Stay Updated, Stay Ahead</p>

                <div class="social-icons">
                    <a href="#"><i class='bx bxl-linkedin'></i></a>
                    <a href="#"><i class='bx bxl-facebook'></i></a>
                    <a href="#"><i class='bx bxl-instagram'></i></a>
                    <a href="#"><i class='bx bxl-twitter'></i></a>
                </div>
            </div>
        </div>

        <div class="logreg-box">
            <div id="login" class="form-box login">
                <form actions="#">
                    <h2>Sign In</h2>

                    <div class="input-box">
                        <span class="icon"><i class="bx bxs-envelope"></i></span>
                        <input type="email" id="login-email" required>
                        <label>Email</label>
                    </div>

                    <div class="input-box">
                        <span class="icon"><i class="bx bxs-lock-alt"></i></span>
                        <input type="password" id="login-password" required>
                        <label>Password</label>
                    </div>

                    <div class="toggle-password">
                        <span onclick="togglePassword()">
                            <i id="eye-icon" class="bx bx-show"></i> Show Password
                        </span>
                        <a href="#" onclick="forgotPassword()">Forgot Password?</a>
                    </div>

                    <button onclick="loginUser()" type="submit" class="btn">Sign In</button>

                    <div class="login-register">
                        <p>Don't have an account? 
                            <a href="#" class="register-link">Sign up</a>
                        </p>
                    </div>
                </form>

            </div>

            <div id="register" class="form-box register">
                <form actions="#">
                    <h2>Sign Up</h2>

                    <div class="input-box">
                        <span class="icon"><i class="bx bxs-user"></i></span>
                        <input type="text" id="reg-name" required>
                        <label>Name</label>
                    </div>

                    <div class="input-box">
                        <span class="icon"><i class="bx bxs-envelope"></i></span>
                        <input type="email" id="reg-email" required>
                        <label>Email</label>
                    </div>

                    <div class="input-box">
                        <span class="icon"><i class="bx bxs-lock-alt"></i></span>
                        <input type="password" id="reg-password" required>
                        <label>Password</label>
                    </div>

                    <div class="remember-forgot">
                        <label><input type="checkbox"> I agree to the terms & conditions </label>
                    </div>

                    <button onclick="registerUser()" type="submit" class="btn">Sign Up</button>

                    <div class="login-register">
                        <p>Already have an account? 
                            <a href="#" class="login-link">Sign in</a>
                        </p>
                    </div>
                </form>

            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
